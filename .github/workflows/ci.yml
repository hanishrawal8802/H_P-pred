name: MLOps CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/mlops-churn

jobs:
  # ─────────────────────────────────────────
  # 1. Lint
  # ─────────────────────────────────────────
  lint:
    name: Code Quality (Black + Flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install black==24.4.2 flake8==7.0.0 isort==5.13.2

      - name: Black format check
        run: black --check src/ api/ dashboard/ tests/ airflow/

      - name: Flake8 lint
        run: flake8 src/ api/ dashboard/ tests/ airflow/ --max-line-length=100 --ignore=E501,W503,E402

      - name: isort check
        run: isort --check-only src/ api/ dashboard/ tests/ airflow/

  # ─────────────────────────────────────────
  # 2. Test
  # ─────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install scikit-learn==1.4.2 xgboost==2.0.3 pandas==2.2.2 numpy==1.26.4 \
            mlflow==2.13.0 fastapi==0.111.0 uvicorn httpx pydantic==2.7.1 \
            openpyxl joblib pyyaml python-dotenv loguru sqlalchemy psycopg2-binary \
            prometheus-client evidently==0.4.30 \
            pytest==8.2.0 pytest-asyncio==0.23.7 pytest-cov==5.0.0

      - name: Run unit tests
        run: |
          pytest tests/unit/ tests/api/ -v --cov=src --cov-report=xml --cov-report=term-missing
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000
          POSTGRES_HOST: localhost

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────
  # 3. Pipeline Test (synthetic data)
  # ─────────────────────────────────────────
  pipeline-test:
    name: Pipeline Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install scikit-learn==1.4.2 xgboost==2.0.3 pandas==2.2.2 numpy==1.26.4 \
            openpyxl joblib pyyaml python-dotenv loguru \
            pytest==8.2.0 pytest-asyncio==0.23.7

      - name: Run pipeline tests
        run: pytest tests/pipeline/ -v
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000

  # ─────────────────────────────────────────
  # 4. Docker Build
  # ─────────────────────────────────────────
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: pipeline-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create placeholder model dir
        run: mkdir -p models data/raw data/processed

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: mlops-churn-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dashboard
          push: false
          tags: mlops-churn-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # 5. Publish (main branch only)
  # ─────────────────────────────────────────
  publish:
    name: Push to Container Registry
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}

      - name: Build and push Dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dashboard
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-dashboard:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-dashboard:${{ github.sha }}
