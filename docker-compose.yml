version: "3.9"

# ─────────────────────────────────────────
# Shared environment for Airflow
# ─────────────────────────────────────────
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mlops:mlops_secret@postgres:5432/airflow_db
    AIRFLOW__CORE__FERNET_KEY: "xq3sMuI1dM9iHlCkX5EgXQeClDRIYGPpITaLOzC3gE8="
    AIRFLOW__WEBSERVER__SECRET_KEY: "churn-mlops-secret-2024"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    MLFLOW_TRACKING_URI: http://mlflow:5000
    POSTGRES_USER: mlops
    POSTGRES_PASSWORD: mlops_secret
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: mlops_db
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
    - ./models:/opt/airflow/models
    - ./monitoring:/opt/airflow/monitoring
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - mlops-network

services:

  # ─────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: mlops-postgres
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops_secret
      POSTGRES_DB: mlops_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - mlops-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mlops", "-d", "mlops_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────
  # MLflow Tracking Server
  # ─────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    container_name: mlops-mlflow
    command: >
      bash -c "pip install --quiet mlflow==2.13.0 psycopg2-binary boto3 &&
               mlflow server
               --backend-store-uri postgresql+psycopg2://mlops:mlops_secret@postgres:5432/mlflow_db
               --default-artifact-root /mlflow/artifacts
               --serve-artifacts
               --workers 4
               --port 5000"
    environment:
      MLFLOW_TRACKING_URI: http://localhost:5000
      MLFLOW_SERVER_HOST: 0.0.0.0
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    ports:
      - "5000:5000"
    networks:
      - mlops-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Airflow Init (DB migration + admin user)
  # ─────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: mlops-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
        echo "Airflow initialised."
    restart: "no"

  # ─────────────────────────────────────────
  # Airflow Webserver
  # ─────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: mlops-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Airflow Scheduler
  # ─────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: mlops-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ─────────────────────────────────────────
  # FastAPI Prediction Service
  # ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: mlops-api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_STAGE: Production
      MODEL_NAME: churn-classifier
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops_secret
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: mlops_db
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./config:/app/config
    ports:
      - "8000:8000"
    networks:
      - mlops-network
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Streamlit Dashboard
  # ─────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: mlops-dashboard
    environment:
      API_URL: http://api:8000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops_secret
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: mlops_db
    volumes:
      - ./models:/app/models
      - ./monitoring:/app/monitoring
      - ./config:/app/config
    ports:
      - "8501:8501"
    networks:
      - mlops-network
    depends_on:
      - api
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Prometheus
  # ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: mlops-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - mlops-network
    restart: unless-stopped

  # ─────────────────────────────────────────
  # Grafana
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: mlops-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: localhost
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - mlops-network
    depends_on:
      - prometheus
    restart: unless-stopped

# ─────────────────────────────────────────
# Networks
# ─────────────────────────────────────────
networks:
  mlops-network:
    driver: bridge
    name: mlops-network

# ─────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────
volumes:
  postgres_data:
    name: mlops-postgres-data
  mlflow_artifacts:
    name: mlops-mlflow-artifacts
  airflow_logs:
    name: mlops-airflow-logs
  prometheus_data:
    name: mlops-prometheus-data
  grafana_data:
    name: mlops-grafana-data
