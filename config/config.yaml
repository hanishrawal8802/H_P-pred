project:
  name: "telecom-churn-mlops"
  version: "1.0.0"
  description: "Production-grade MLOps platform for IBM Telco Customer Churn prediction"

# ─────────────────────────────────────────
# Data Configuration
# ─────────────────────────────────────────
data:
  raw_data_path: "data/raw/telco_churn_raw.csv"
  processed_data_path: "data/processed/telco_churn_processed.csv"
  validation_report_path: "data/validation/"
  source_excel: "Telco_customer_churn.xlsx"
  target_column: "Churn Label"
  customer_id_column: "CustomerID"
  test_size: 0.2
  random_state: 42

  # Columns to drop (IDs, redundant)
  drop_columns:
    - "CustomerID"
    - "Lat Long"
    - "Zip Code"
    - "Latitude"
    - "Longitude"

  # Categorical columns
  categorical_columns:
    - "Gender"
    - "Senior Citizen"
    - "Partner"
    - "Dependents"
    - "Phone Service"
    - "Multiple Lines"
    - "Internet Service"
    - "Online Security"
    - "Online Backup"
    - "Device Protection"
    - "Tech Support"
    - "Streaming TV"
    - "Streaming Movies"
    - "Contract"
    - "Paperless Billing"
    - "Payment Method"
    - "City"
    - "State"
    - "Country"
    - "Churn Reason"
    - "Churn Category"

  # Numerical columns
  numerical_columns:
    - "Tenure Months"
    - "Monthly Charges"
    - "Total Charges"
    - "Total Long Distance Charges"
    - "Total Revenue"
    - "Avg Monthly Long Distance Charges"
    - "Avg Monthly GB Download"
    - "Number of Referrals"
    - "Number of Dependents"
    - "CLTV"

# ─────────────────────────────────────────
# Feature Engineering
# ─────────────────────────────────────────
features:
  scaling_strategy: "standard"   # standard | minmax | robust
  encoding_strategy: "onehot"    # onehot | ordinal | target
  feature_selection:
    enabled: true
    method: "mutual_info"        # mutual_info | chi2 | rfe
    k_features: 20
  pipeline_path: "models/feature_pipeline.pkl"

# ─────────────────────────────────────────
# Model Training
# ─────────────────────────────────────────
training:
  experiment_name: "telco-churn-experiment"
  run_name_prefix: "churn-run"
  metric_for_best_model: "roc_auc"
  models:
    logistic_regression:
      enabled: true
      hyperparams:
        C: [0.01, 0.1, 1.0, 10.0]
        max_iter: [500]
        solver: ["lbfgs"]
        class_weight: ["balanced"]
    random_forest:
      enabled: true
      hyperparams:
        n_estimators: [100, 200]
        max_depth: [5, 10, null]
        min_samples_split: [2, 5]
        class_weight: ["balanced"]
    xgboost:
      enabled: true
      hyperparams:
        n_estimators: [100, 200]
        max_depth: [3, 5, 7]
        learning_rate: [0.05, 0.1, 0.2]
        scale_pos_weight: [1, 3]

# ─────────────────────────────────────────
# MLflow
# ─────────────────────────────────────────
mlflow:
  tracking_uri: "http://mlflow:5000"
  model_name: "churn-classifier"
  registered_model_stages:
    - "None"
    - "Staging"
    - "Production"
    - "Archived"

# ─────────────────────────────────────────
# API
# ─────────────────────────────────────────
api:
  host: "0.0.0.0"
  port: 8000
  title: "Telecom Churn Prediction API"
  version: "1.0.0"
  model_stage: "Production"

# ─────────────────────────────────────────
# Monitoring & Drift Detection
# ─────────────────────────────────────────
monitoring:
  drift_threshold: 0.15          # Jensen-Shannon divergence threshold
  psi_threshold: 0.2             # PSI threshold for feature drift
  prediction_drift_threshold: 0.1
  retrain_on_drift: true
  drift_report_path: "monitoring/evidently/reports/"
  reference_data_path: "data/processed/reference_data.csv"

# ─────────────────────────────────────────
# Airflow
# ─────────────────────────────────────────
airflow:
  pipeline_schedule: "@weekly"
  retrain_schedule: "@daily"
  email_on_failure: false

# ─────────────────────────────────────────
# Database
# ─────────────────────────────────────────
database:
  host: "postgres"
  port: 5432
  name: "mlops_db"
  predictions_table: "predictions"
  metrics_table: "model_metrics"
